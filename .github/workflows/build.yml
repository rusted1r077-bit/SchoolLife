name: Build Ren'Py APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -o SchoolLife_JoiPlay*.zip -d project
          ls -R project

      - name: Build with Ren'Py
        uses: ProjectAliceDev/renpy-build-action@master
        with:
          sdk-version: '8.2.3'
          project-dir: project/SchoolLife
          package: android
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolLife-apk
          path: '**/*.apk'
